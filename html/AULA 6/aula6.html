<body>
    <!-- A semântica no HTML significa usar as tags certas para cada tipo de conteúdo , ajudando navegadores , mecanismos de buscas e leitores de tela a entenderem melhor a estrutra da página  -->

    <!-- Benefícios do HTML Semântico -->
     <!-- Melhor a acessibilidade (Leitores de tela conseguem interpretar melhor) 
      Melhora o SEO (O google entende melhor a estrutura do site)
      Facilita a manutenção do código (código mais organizado e legível)
      Ajuda na resposividade (tags semânticas trabalham melhor com CSS e JS) -->

      <!-- SEM SEMÂNTICA -->
       <!-- <a href="#"Início</a> 
       <a href="#"Sobre</a>
       <p>Texto Principal do Site</p>
       <p>Todos os direitos reservados</p>
-->
<!-- HTML SEMÂNTICO -->
        <header>
            <!-- Corpo do site ou de uma seção- logo, todas as informações, Titulo e menu de navegação -->
            <nav>
                <!-- Contém links de navegação parav outras partes do site -->
                <a href="">Inicio</a>
                <a href="">Sobre</a>

            </nav>
        </header>
        <main>
<!-- Conteúdo principal da página -->
 <h1>Notícias AO VIVO DO SESI</h1>

 <section>
<!-- <!-- Usada para agrupar conteúdos relacionados dentro de uma página, geralmente com um título, indicando que fazem parte de um tem específico  -->
<p>Texto Principal do Site</p>
        </main>  
        <footer>
        <p>Hoje foi anunciado um novo projeto</p>
        </footer>

<article>

<h3>Os alunos amam ir para o SENAI</h3>

 </section>

     -Informações adicionais
     -Anúncio
      -->
