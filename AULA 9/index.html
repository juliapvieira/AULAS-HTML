<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <!-- CSS Interno --> <!-- Dentro da tag <style> no <head> do HTML -->
    <style>
        h1 {
            color: red
        }
    </style>
<!-- ************************************ -->
<!-- CSS EXTERNO- O MELHOR -->
<!-- ************************************ -->
<link rel="stylesheet" href="style.css"


</head>

<body>


    </head>

    <body>
        <!--
        CSS (Cascading Style Sheets) é o que dá forma, cor, design e estilo ao HTML
    
    -->

        <!-- Inline -->
        <!-- Define diretamente na tag HTML, dentro do atributo style -->
        <!-- Quando usar? Quando você precisa estilizar um único elemento rapidamente (ex: testar uma cor diferente do botão)-->

        <h1 style="font-size: 24px;"> Título em vermelho </h1>

        <h1 style="font-size: 24px;"> </h1>

<h2>DSI1 SESI OS MELHORES</h2>


    </body>

</html>


</body>

</html>
